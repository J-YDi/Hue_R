# Builds the Shiny app in app/ with Shinylive (runs in the browser through webR)
# and publishes it on GitHub Pages.
# One-time setup: Settings > Pages > Build and deployment > Source = "GitHub Actions".
name: Deploy Shinylive app to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/deploy-shinylive.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install shinylive
        run: Rscript -e 'install.packages(c("shinylive", "shiny", "bslib"))'

      - name: Export app
        run: Rscript -e 'shinylive::export("app", "site")'

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
